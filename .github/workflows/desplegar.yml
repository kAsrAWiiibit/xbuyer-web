# Publica la web en GitHub Pages en cada push a main.
# Con el dominio de src/data/sitio.mjs, la build escribe el CNAME y la sirve en la raíz.
# Mientras el DNS no apunte a GitHub Pages, la variable del repositorio SIN_DOMINIO=1 la publica en
# https://<usuario>.github.io/<repositorio>/ (BASE_PATH y SITE_URL). Para pasar al dominio:
# gh variable set SIN_DOMINIO --body 0 y volver a lanzar el flujo.
name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          SIN_DOMINIO: ${{ vars.SIN_DOMINIO }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
